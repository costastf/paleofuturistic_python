      - Convert the library into a CLI: using/how-to/convert-library-to-cli.md
      - Choose the Python version range: using/how-to/choose-python-version-range.md
      - Publish docs to GitHub Pages: using/how-to/publish-docs-to-github-pages.md
    - Reference:
      - Copier questions: using/reference/copier-questions.md
      - Generated project tree: using/reference/generated-project-tree.md
      - License options: using/reference/license-options.md
      - Packaging specifications: using/reference/packaging-specifications.md
