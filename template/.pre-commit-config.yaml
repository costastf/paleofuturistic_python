# `pre-commit install` installs every type listed here, so the pre-push hook below is
# wired up by the same bootstrap step as the rest.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: local
    hooks:
      - id: lint-commit
        name: Lint commit message
        description: "Example: feat: added new feature"
        entry: sh -c './workflow.cmd lint.commitizen --commit-msg-file="$1"' --
        language: system
        pass_filenames: true
        stages: [commit-msg]
      # One hook, one invocation, for every check that can be judged from the staged files
      # alone — formatting, ruff, pylint, complexipy. It used to be four hooks, plus ty and
      # pyscn, and that shape cost most of a commit's time budget starting processes: each
      # `./workflow.cmd` spends about 1.3s on interpreter and imports before a tool runs, so
      # six hooks paid ~8s of startup to do ~2s of checking. Collapsed, the same four checks
      # measure ~2.9s on a fresh project, of which 1.6s is the one startup.
      #
      # Which tools belong here is decided in `_CI/tasks/preflight.py`, not here: the hook
      # runs `preflight.staged`, which reads the step registry and applies each step's own
      # path filter (complexipy is `src/` only, the rest also cover `_CI/tasks/` and
      # `tests/`) — filters that lived in the `files:` keys of the hooks this replaces. The
      # `files:` below is therefore the union of them, and an invariant test asserts this
      # hook and the registry's per-file steps agree.
      #
      # `sh -c … --` collapses the file list pre-commit appends into the single `--paths`
      # value Invoke expects; Invoke would otherwise read the second filename as another task
      # name and fail. (Filenames containing spaces are not supported by that marshalling —
      # as with `lint-commit`.)
      #
      # This hook does rewrite files: formatting is applied, not just reported. Those are
      # files the author staged, and pre-commit's "files were modified by this hook" is the
      # intended nudge to stage the result. What no commit-stage hook may touch is a tracked
      # file the author did *not* stage — see the pre-push hook below.
      - id: staged
        name: Check staged files (format, ruff, pylint, complexipy)
        entry: sh -c './workflow.cmd preflight.staged --paths="$*"' --
        language: system
        pass_filenames: true
        files: ^(_CI/tasks/|src/|tests/).*\.py$
        stages: [pre-commit]
      # Everything whole-program runs here instead of on every commit: ty needs the callers of
      # a changed signature, pyscn needs every file to know what is dead or duplicated, pytest
      # needs the suite. Their cost scales with the size of the *project*, not of the change,
      # so on pre-commit they were the one thing that would make commits slower as the project
      # grew. On pre-push they run once per push and keep commit latency flat.
      #
      # `--check` is what makes this safe to run from a hook at all. `preflight` on its own
      # writes the four README badges and ratchets `fail_under` in pyproject.toml; run from a
      # commit hook that aborted the commit with "files were modified by this hook" — after
      # the message was written, for files the author never staged — which is exactly what
      # teaches people `--no-verify` and so disables every hook here at once. `--check` runs
      # the identical steps, writes nothing tracked, and fails with the command to fix it.
      # Those writes belong to a deliberate `./workflow.cmd preflight`.
      #
      # It also means the hook and the CI preflight job run the same command, so a stale badge
      # cannot pass locally and fail in the pipeline. `SKIP=preflight git push` is the escape
      # hatch when you need one; unlike `--no-verify` it leaves the other hooks in place.
      - id: preflight
        name: Preflight checks (ty, pyscn, tests, derived files)
        entry: ./workflow.cmd preflight --check
        language: system
        pass_filenames: false
        files: ^(_CI/tasks/|src/|tests/).*\.py$
        stages: [pre-push]
      - id: security-overrides
        name: Validate .security-overrides
        entry: ./workflow.cmd secure.validate-overrides
        language: system
        pass_filenames: false
        files: ^\.security-overrides$
        stages: [pre-commit]
