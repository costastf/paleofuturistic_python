# `pre-commit install` installs every type listed here, so the pre-push hook below is
# wired up by the same bootstrap step as the rest.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: local
    hooks:
      - id: lint-commit
        name: Lint commit message
        description: "Example: feat: added new feature"
        entry: sh -c './workflow.cmd lint.commitizen --commit-msg-file="$1"' --
        language: system
        pass_filenames: true
        stages: [commit-msg]
      # One hook, one invocation, for every check that can be judged from the staged files
      # alone — formatting, ruff, pylint, complexipy. It used to be four hooks, plus ty and
      # pyscn, and that shape cost most of a commit's time budget starting processes: each
      # `./workflow.cmd` spends about 1.3s on interpreter and imports before a tool runs, so
      # six hooks paid ~8s of startup to do ~2s of checking. Collapsed, the same four checks
      # measure ~2.9s on a fresh project, of which 1.6s is the one startup.
      #
      # Which tools belong here is decided in `_CI/tasks/preflight.py`, not here: the hook
      # runs `preflight.staged`, which reads the step registry and applies each step's own
      # path filter (complexipy is `src/` only, the rest also cover `_CI/tasks/` and
      # `tests/`) — filters that lived in the `files:` keys of the hooks this replaces. The
      # `files:` below is therefore the union of them, and an invariant test asserts this
      # hook and the registry's per-file steps agree.
      #
      # `sh -c … --` collapses the file list pre-commit appends into the single `--paths`
      # value Invoke expects; Invoke would otherwise read the second filename as another task
      # name and fail. (Filenames containing spaces are not supported by that marshalling —
      # as with `lint-commit`.)
      #
      # `--fix` is why this hook rewrites files: formatting is applied, not just reported.
      # Those are files the author staged, and pre-commit's "files were modified by this hook"
      # is the intended nudge to stage the result. The flag is passed here rather than being
      # the task's default so that the one editing step in the whole workflow is visible in
      # the configuration that asks for it. What no commit-stage hook may touch is a tracked
      # file the author did *not* stage — see the pre-push hook below.
      - id: staged
        name: Check staged files (format, ruff, pylint, complexipy)
        entry: sh -c './workflow.cmd preflight.staged --fix --paths="$*"' --
        language: system
        pass_filenames: true
        files: ^(_CI/tasks/|src/|tests/).*\.py$
        stages: [pre-commit]
      # Everything whole-program runs here instead of on every commit: ty needs the callers of
      # a changed signature, pyscn needs every file to know what is dead or duplicated, the
      # matrix needs the suite on every interpreter, and a wheel builds from the whole tree or
      # not at all. Their cost scales with the size of the *project*, not of the change, so on
      # pre-commit they were the one thing that would make commits slower as the project grew.
      # On pre-push they run once per push and keep commit latency flat (~19s on a scaffold).
      #
      # No flag: `preflight` verifies by default and writing is opt-in, which is what makes
      # it safe to run from a hook at all. `preflight --write` updates the four README badges
      # and ratchets `fail_under` in pyproject.toml; from a hook that aborted the push having
      # modified files the author never staged, which is exactly what teaches people
      # `--no-verify` and so disables every hook here at once. Those writes belong to a
      # deliberate `./workflow.cmd preflight --write`.
      #
      # It also means this hook and the CI pipeline run the same command, character for
      # character — the whole pipeline, since the separate lint, test and build jobs folded
      # into it — so nothing in CI can reject what this accepted, and reproducing a pipeline
      # failure needs no flag. There is deliberately no flag to make it run *less*: the knob
      # that shortens the matrix is `env_list` in pyproject.toml, which shortens CI too and so
      # cannot open a gap. `SKIP=preflight git push` is the escape hatch when you need one;
      # unlike `--no-verify` it leaves the other hooks in place.
      - id: preflight
        name: Preflight checks (ty, pyscn, test matrix, wheel, derived files)
        entry: ./workflow.cmd preflight
        language: system
        pass_filenames: false
        files: ^(_CI/tasks/|src/|tests/).*\.py$
        stages: [pre-push]
      - id: security-overrides
        name: Validate .security-overrides
        entry: ./workflow.cmd secure.validate-overrides
        language: system
        pass_filenames: false
        files: ^\.security-overrides$
        stages: [pre-commit]
