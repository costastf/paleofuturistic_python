name: Build dependency image

on:
  workflow_call:
    outputs:
      image:
        description: Dependency image reference
        value: ${{ jobs.build-deps-image.outputs.image }}

# The organisation's package index, when there is one: repository variables, empty in the
# open. A called workflow inherits no `env:` from its caller, so they are named here too; the
# build mints its credentials from them and the job's OIDC token (ADR-0063, ADR-0064).
env:
  UV_DEFAULT_INDEX: ${{ vars.UV_DEFAULT_INDEX }}
  UV_PYTHON_INSTALL_MIRROR: ${{ vars.UV_PYTHON_INSTALL_MIRROR }}
  JFROG_URL: ${{ vars.JFROG_URL }}
  JFROG_PROJECT: ${{ vars.JFROG_PROJECT }}
  JFROG_AUDIENCE: ${{ vars.JFROG_AUDIENCE }}
  JFROG_PROVIDER: ${{ vars.JFROG_PROVIDER }}

jobs:
  build-deps-image:
    name: Build dependency image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Behind a fenced index the build mints its credentials from an OIDC token; every caller
      # grants the same scope, a called workflow getting no more than its caller has.
      id-token: write
    outputs:
      image: ${{ steps.deps.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # No credential left in `.git/config` after the fetch; `origin` stays clean.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Publish deps image
        id: deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The organisation's package index, when there is one: a repository variable and
          # two secrets, empty otherwise. They reach the builder stage of `Dockerfile.deps`
          # only, and the audit below checks that they stayed there (ADR-0063). The same
          # identity logs the engine in to the base image's registry first, when the index
          # host serves it (ADR-0065).
          INDEX_URL: ${{ vars.UV_DEFAULT_INDEX }}
          INDEX_USERNAME: ${{ secrets.INDEX_USERNAME }}
          INDEX_PASSWORD: ${{ secrets.INDEX_PASSWORD }}
        run: |
          ./workflow.cmd container.publish
          ./workflow.cmd container.audit
          echo "image=$(cat .deps-image)" >> "$GITHUB_OUTPUT"

      - name: Minimize uv cache
        run: uv cache prune --ci
