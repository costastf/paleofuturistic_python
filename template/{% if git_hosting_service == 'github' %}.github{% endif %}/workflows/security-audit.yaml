name: Security audit

# Every trigger the audit has, and none of them is "every push": the audit's answer depends on
# the advisory database on the day it runs, not on the branch, so it runs on a schedule, on
# changes to the dependency surface, and before publishing (`release.dist`). The reasoning is in
# docs/developer/explanation/sbom-and-security-model.md, under "When it runs".
on:
  schedule:
    # Daily. The minute is deliberately not :00 — GitHub sheds on-the-hour scheduled
    # jobs when the queue is busy. Adjust the cadence to taste.
    - cron: '17 3 * * *'
  push:
    paths:
      # `uv.lock` covers every real dependency change: the project runs `--frozen` throughout,
      # so a `pyproject.toml` edit that changes what is installed changes the lockfile with it.
      # Watching `pyproject.toml` too meant a coverage-ratchet bump — a number in a table —
      # firing a full audit of a dependency set nobody had touched. A release still audits:
      # `[tool.commitizen] version_provider = "uv"` re-locks, so the bump commit carries the
      # root package's own version line in `uv.lock`. That one is worth auditing anyway, being
      # the commit that publishes.
      - 'uv.lock'
      # The vendored CI dependencies: `secure.audit` audits `vendor.txt` by name, since the
      # trees ship as source with no `.dist-info` for any installed-distribution scan to find.
      # The tree and its patches are watched too — nothing audits a hand-edited vendored file,
      # but a push that touches one is worth a human reading the diff.
      - '_CI/lib/vendor.txt'
      - '_CI/lib/vendor/**'
      - '_CI/lib/patches/**'
      - '.security-overrides'
  # The same files, for a pull request from a fork, whose push to its own repository runs
  # nothing here. Pull requests from branches of this repository are covered by the push.
  # The list is repeated because a workflow file cannot share one between two triggers; an
  # invariant in the template keeps the two equal.
  pull_request:
    paths:
      - 'uv.lock'
      - '_CI/lib/vendor.txt'
      - '_CI/lib/vendor/**'
      - '_CI/lib/patches/**'
      - '.security-overrides'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deps-image:
    # A pull request's token cannot push to ghcr; see continuous-integration.yaml. The fork
    # job below audits on the runner's own image instead.
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/build-deps-image.yaml
    permissions:
      contents: read
      packages: write

  secure:
    name: Security audit
    needs: build-deps-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-deps-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Audit dependencies
        run: ./workflow.cmd secure.audit

  # The same audit for a pull request from a fork that touches the dependency surface, with
  # the dependencies installed at job time rather than read from the deps image. Same name
  # as the job above, for the same reason `Preflight` is spelled twice in
  # continuous-integration.yaml.
  secure-from-fork:
    name: Security audit
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Audit dependencies
        run: ./workflow.cmd secure.audit

      - name: Minimize uv cache
        run: uv cache prune --ci
