name: Continuous Integration

on:
  push:

# One job runs the checks, because it runs the same command the pre-push hook does, character
# for character: `preflight`. Verifying is that command's default and writing is opt-in, so
# there is no flag here to keep in step with the hook, and reproducing a failure from this log
# means typing what you see. Separate lint, test and build jobs used to re-run, in a different
# shape, the work that command already covers — so a green push could still meet a red
# pipeline over which of the two had been kept in step. Absorbing them costs the wall-clock
# those jobs bought by running in parallel; `run_steps` still reports every failure in one
# pass, so it costs time, not diagnosis.
#
# What is deliberately *not* here: the dependency audit, which runs on a schedule and on
# pushes that touch the dependency surface (see security-audit.yaml), because an advisory
# published overnight is not something this branch's author introduced or can fix.
#
# Workflow-level permissions floor. Without it every job would inherit the repository
# default, which for many repositories is the full read/write token — far more than a check
# run needs. Jobs below narrow further; none of them writes anything.
permissions:
  contents: read

# Why every checkout below sets `persist-credentials: false`, stated once rather than in
# each job: auth goes into an `http.extraheader` that is removed once the fetch is done, so
# no credential is left in `.git/config` and `origin` stays a clean URL. That matters
# because the SBOM reads `origin` for its VCS reference and ships inside the wheel — a token
# there becomes public and permanent. An invariant asserts none of these copies drifts.

jobs:
  build-deps-image:
    uses: ./.github/workflows/build-deps-image.yaml
    permissions:
      contents: read
      # The only job that publishes: it pushes the deps image to ghcr.
      packages: write

  preflight:
    name: Preflight
    needs: build-deps-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pulling the deps image from ghcr goes through GITHUB_TOKEN; without
      # `packages: read` the manifest request comes back 403.
      packages: read
    container:
      image: ${{ needs.build-deps-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # See the note above the jobs for why.
          persist-credentials: false

      # The same command the pre-push hook runs, which is the point: anything that fails here
      # would have failed the push too, so the pipeline is a backstop rather than the place
      # you first hear about it. Format, lint, ty, pyscn, the tox matrix, the wheel, and the
      # README badges and coverage ratchet matching what the tools measure.
      #
      # Note the absence of `--write`. `permissions: contents: read` and the
      # `persist-credentials: false` checkout above mean this job could not commit a
      # refreshed badge even if it wanted to; its only useful move is to fail and name the
      # command that fixes it.
      - name: Verify checks and derived files
        run: ./workflow.cmd preflight
