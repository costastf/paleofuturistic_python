[project]
name = "paleofuturistic-python-template"
version = "0.0.0"
description = "Repository scaffolding for the copier template; not a publishable package."
requires-python = ">=3.12"

[tool.uv]
package = false
# Bump with `./workflow.cmd maintain.bump-uv`, which moves this, the template's four version
# literals and all five per-Python image digests in one step. This value does double duty: it
# is the uv CI installs before generating anything, and the floor a generated project falls
# back to when it cannot reach PyPI.
required-version = "==0.12.6"
# Fixed date, not a relative window. `exclude-newer = "1 week"` moved forward every day,
# so a resolution could change — and a gate could go red — with no commit behind it. The
# value below is exactly where that rolling window sat when it was frozen, so resolution
# did not shift at the time of the change.
#
# Bumping it is a deliberate act: raise the date, re-resolve, and land the resulting
# dependency-group bumps in the same commit so the quarantine boundary and the pins always
# agree.
#
# This is the template repository's own boundary, maintained by hand. Generated projects
# get theirs stamped with their generation date by tasks_render.py, so a project created
# later does not inherit a boundary that has receded into the past.
exclude-newer = "2026-08-07"

[dependency-groups]
# PyYAML parses copier.yml in _CI.tasks.configuration.base_context; the `dev` group is
# auto-synced by `uv run` (invoke tasks) and included alongside `--group test` (pytest).
dev = [
    "pyyaml",
]
test = [
    "pytest",
]
# Pinned to the same ruff the template pins, so this repository and the projects it
# generates are judged by one version. Bump both together.
lint = [
    "ruff==0.15.22",
]

# Mirrors the rule set generated projects get, so the repository that defines the standard is
# held to it. `_CI/tasks/` keeps its own lighter config in `_CI/pyproject.toml`, exactly as a
# generated project's does — ruff resolves the nearest config, so this block governs
# `tasks_render.py` and `tests/` only.
[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["_CI/lib"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "CPY001",  # missing-copyright-notice
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "Q000",    # bad-quotes-inline-string (conflicts with format.quote-style)
    "Q003",
]

[tool.ruff.lint.per-file-ignores]
# The first four match the template's own `tests/*.py` exemptions.
"tests/*.py" = [
    "S101",
    "S311",
    "RUF012",
    "PLR2004",
    # Deliberate divergence from generated projects, whose tests are annotated: these are
    # pytest functions taking fixtures and returning None. Annotating ~265 of them adds
    # churn without catching anything, and the fixture types are the least interesting
    # signatures in the repository.
    "ANN001",
    "ANN201",
    "ANN202",
    # The suite drives `git`, `uvx` and `./workflow.cmd` by name on purpose; resolving
    # absolute paths for them would test something other than what users run.
    "S603",
    "S607",
]
# A copier task: its stdout is the user-facing output of generation, not stray debugging.
"tasks_render.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"

# The vendored invoke under `_CI/lib/vendor/` and `template/_CI/lib/vendor/` is not maintained
# here — it is built by schubergphilis/vendored_invoke and copied in verbatim. Move it with
# `./workflow.cmd maintain.sync-vendor`, never by hand: an edited tree silently stops matching
# its source, which is exactly the state this pin exists to prevent.
#
# `commit` is the tag dereferenced to a commit. Tags move; commits do not, which is the same
# reason every GitHub Action here is pinned by SHA rather than by version.
[tool.vendored-invoke]
repository = "schubergphilis/vendored_invoke"
version = "v1.0.0"
commit = "ffbd48d334d80a79cca65a0f31cc86f25d489e96"

[tool.properdocs]
version = "1.6.7"
theme-mkdocs-version = "1.6.7"
