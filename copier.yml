_subdirectory: template
_answers_file: .copier-answers.yml
# _templates_suffix defaults to ".jinja"; we rely on that. Files lacking the suffix
# are copied verbatim (vendored _CI/lib/**, binaries, static configs), which removes
# the need for a copy-without-render exclusion list.

# Seeded once, then left alone forever. Everything else under `_CI/tasks/` is template-owned
# and gets replaced on update, so a project's own tasks need somewhere that does not. Without
# this entry `local.py` would be overwritten — or conflict — on every `copier update`, which
# is the whole problem it exists to solve.
_skip_if_exists:
  - _CI/tasks/local.py

# One task, in Python, with no shell between copier and it: the license, the two stamps, the
# executable bit and the lockfile all happen in tasks_render.py, so generation works from a
# Windows prompt as it does from a POSIX shell (ADR-0055). `copy` only: on update the project
# already has a lock, and refreshing it is the owner's call to make deliberately.
_tasks:
  - command: >-
      {{ _copier_python }} {{ _copier_conf.src_path }}/tasks_render.py
      --license "{{ license }}"
      --author "{{ full_name }}"
    when: "{{ _copier_operation == 'copy' }}"

project_name:
  type: str
  default: "Paleofuturistic Python Project"
  help: A descriptive name for the project

project_slug:
  type: str
  default: >-
    {{ project_name | lower
       | regex_replace('[^a-z0-9_]+', '_')
       | regex_replace('_+', '_')
       | trim('_') }}
  help: The slugified name for the project (must be a valid Python identifier)
  validator: >-
    {% if not project_slug %}project_slug cannot be empty
    {% elif not (project_slug | regex_search('^[a-z]([a-z0-9_]*[a-z0-9])?$')) %}'{{ project_slug }}' must be a valid import name and PyPI project name: lowercase ASCII letters, digits and underscores, starting with a letter and ending with a letter or digit{% endif %}

project_description:
  type: str
  default: "Development flow as Paleofuturistic Python"
  help: Provide a short, clear description

full_name:
  type: str
  default: "John Doe"
  help: What is the owner's full name

email:
  type: str
  default: "me@here.now"
  help: What is the owner's email

min_python_version:
  type: str
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
    - "3.15"
  default: "3.11"
  help: Minimum supported Python version

max_python_version:
  type: str
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
    - "3.15"
  default: "3.15"
  help: Maximum supported Python version (must be >= the minimum and share its major)
  validator: >-
    {% if max_python_version.split('.')[0] != min_python_version.split('.')[0] %}
    min and max Python versions must share a major version
    {% elif (max_python_version.split('.')[1] | int) < (min_python_version.split('.')[1] | int) %}
    max_python_version must be greater than or equal to min_python_version
    {% endif %}

# The exact version `requires-python` and `.python-version` carry for the chosen minimum.
# 3.11 is in security-only maintenance, so every patch below the current one lacks fixes it
# has, and the documentation stack (pymdown-extensions 13) needs at least 3.11.5: the floor
# is the newest 3.11 release, spelled in full so uv fetches that one instead of settling for an
# older 3.11 it finds on the machine. Every other series floors at its minor (ADR-0060).
# Never asked and never stored: derived from `min_python_version` on every render.
python_floor:
  type: str
  when: false
  default: "{{ {'3.11': '3.11.18'}.get(min_python_version, min_python_version) }}"

# The two formatting choices a project is likely to hold an opinion on. They govern `src/`
# and `tests/`; the tooling under `_CI/` keeps the template's 120 columns and single quotes
# through its own `_CI/pyproject.toml`, which ruff resolves for that tree, so a narrower width
# does not fail the shipped modules on comments nothing rewraps (ADR-0061). The docstring
# convention is not asked: the shipped docstrings are written to Google's sections, and the
# docstring rules have no autofix that could rewrite them to another.
line_length:
  type: int
  default: 120
  help: Line length ruff formats and checks your code to (the tooling under _CI keeps 120)
  validator: >-
    {% if line_length < 79 or line_length > 320 %}line_length must be between 79 and 320, the range ruff accepts{% endif %}

quote_style:
  type: str
  choices:
    - "single"
    - "double"
  default: "single"
  help: Quote style ruff formats your strings to (docstrings are double-quoted either way)

license:
  type: str
  choices:
    - "Apache-2.0"
    - "MIT"
    - "BSD-3-Clause"
    - "None"
  default: "Apache-2.0"
  help: Which license to apply (None ships no LICENSE file)

git_hosting_service:
  type: str
  choices:
    - "github"
    - "gitlab"
  default: "github"
  help: Which git hosting service the project targets

# The branch a release lands on. The pipelines trigger on it by name, which has to be written at
# generation time, and the tasks read the same answer from `_CI/tasks/configuration.py`, so it
# is spelled in one place (ADR-0040). The validator accepts what `git check-ref-format` would
# for a branch, narrowed to what fits in a YAML list and a badge URL without quoting.
default_branch:
  type: str
  default: "main"
  help: The default branch, where releases land and the publish pipeline runs
  validator: >-
    {% if not default_branch %}default_branch cannot be empty
    {% elif not (default_branch | regex_search('^[A-Za-z0-9][A-Za-z0-9._/-]*$')) or '..' in default_branch or default_branch.endswith('/') or default_branch.endswith('.lock') %}'{{ default_branch }}' is not a branch name git accepts: letters, digits, `.`, `_`, `/` and `-`, starting with a letter or digit, no `..`, not ending in `/` or `.lock`{% endif %}

# Feeds `[project.urls]`, the links PyPI shows in the sidebar of the project page. Suggested
# from the host's public instance, the email's local part as the owner, and the slug: right
# for most projects and one edit away for the rest. A project with no public home yet clears
# it, which ships no `[project.urls]` at all rather than links that would 404 on PyPI forever.
# Normalised in pyproject.toml.jinja (trailing `/` and `.git` dropped), so a pasted clone URL
# works too.
repository_url:
  type: str
  # GitHub owner names allow only letters, digits and hyphens, so on GitHub the local part's
  # other characters become hyphens (`jane.doe` suggests `jane-doe`). GitLab allows dots.
  default: >-
    {%- set owner = email.split('@') | first -%}
    {%- if git_hosting_service == 'github' -%}
    {%- set owner = owner | regex_replace('[^A-Za-z0-9-]+', '-') -%}
    {%- endif -%}
    https://{{ git_hosting_service }}.com/{{ owner }}/{{ project_slug }}
  help: >-
    Public https URL of the repository, e.g. https://github.com/acme/widget
    (clear it to ship no [project.urls] for now)
  validator: >-
    {% if repository_url and not (repository_url | trim | regex_search('^https://[^/\\s]+/[^\\s]+$')) %}
    repository_url must be empty or an https URL like https://github.com/acme/widget
    {% endif %}

integrate_pages:
  type: bool
  default: true
  help: Integrate GitHub Pages for documentation deployment?
  # Every use of the answer is gated on GitHub, so GitLab projects are not asked. The default
  # still applies, which keeps the variable defined wherever the templates read it.
  when: "{{ git_hosting_service == 'github' }}"
