[project]
name = 'workflow-tooling'
version = '0.1.0'
description = 'A vendored version of invoke that can be used to construct portable development workflows with no dependencies other than a recent version of python.'
requires-python = ">=3.12"

[build-system]
requires = ['setuptools', 'wheel']
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
# Content: what ends up in lib/vendor/ and, for the template copy, ships to every generated
# project. Nothing belongs here that the shipped `_CI/` code does not import.
vendor = ['invoke', 'coloredlogs']

# Tooling: performs the vendoring, never gets vendored. Run on demand with `uvx`; see
# `./workflow.cmd maintain.sync-vendor` and the upstream README. This used to sit in `vendor`
# above, which made re-vendoring self-hosting at the cost of shipping ~5.8 MB of maintainer
# tooling to every consumer. pip-tools is gone entirely: `uv pip compile` replaces it.
maintenance = ['vendoring==1.2.0']

[tool.vendoring]
destination = './lib/vendor/'
requirements = './lib/vendor.txt'
namespace = 'lib.vendor'

protected-files = ['__init__.py', 'vendor.txt']
patches-dir = './lib/patches'

[tool.setuptools]
py-modules = []  # https://github.com/jazzband/pip-tools/issues/1711 :facepalm:

[tool.vendoring.transformations]
# Every rule this list used to hold rewrote imports for pygments, jsonschema, urllib3, rich,
# wheel, build, packaging or referencing — all transitive dependencies of the vendoring
# toolchain vendoring itself, and none of them vendored any more. Add one only if
# `vendoring sync` leaves a module importing a bare top-level name.
substitute = []

drop = [
    # Test suites: never imported, and they pull fixtures the tree does not carry.
    'coloredlogs/tests.py',
    # humanfriendly ships modules that cannot run on the Pythons this template supports:
    # cli.py and testing.py `import pipes`, removed in 3.13, and sphinx.py needs docutils,
    # which is not vendored. coloredlogs imports none of them.
    'humanfriendly/cli.py',
    'humanfriendly/testing.py',
    'humanfriendly/sphinx.py',
    # Console entry points for libraries we import but never run as commands. Only the invoke
    # ones are launched, and each surviving script needs a hunk in path_inject.patch.
    'bin/coloredlogs',
    'bin/humanfriendly',
]

[tool.ruff]
# Kept at 120 to match the template's `_CI/pyproject.toml`, the root ruff `line-length` and the
# root pylint `max-line-length`. A higher value here only creates lines that ruff accepts and
# the real lint gate rejects.
line-length = 120

[tool.ruff.format]
quote-style = "single"
